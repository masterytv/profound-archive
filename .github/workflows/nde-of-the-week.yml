name: NDE of the Week (Monday send, made from Sunday)

# Project Profound's weekly email (src/app/api/email/weekly-draft/route.ts). Tom, 2026-11-19: it sends itself every
# Monday at 9:00 am Eastern. The app makes the Resend broadcast, scheduled for Monday 9:00 am ET, on the first call
# within 36 hours of it, and emails Tom the link to cancel it before then; earlier calls do nothing. Google Cloud
# Scheduler calls it on Sunday evening (Tom, 2026-11-24: GitHub started this job hours late, then skipped it); this
# workflow is the backup, on Sunday and Monday at 11:23 UTC (6:23 am EST, 7:23 am EDT), and a second call for the same
# Monday does nothing. With the app's NEWSLETTER_AUTOSEND=off it makes a draft instead. Run by hand from the Actions
# tab to do it now. Soul Wisdom's weekly email is the soulwisdomnetwork repo's own.

on:
  schedule:
    - cron: '23 11 * * 0,1'
  workflow_dispatch: {}

jobs:
  send:
    name: Schedule this week's email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the app to schedule it
        run: |
          body=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://projectprofound.org/api/email/weekly-draft")
          code=$(echo "$body" | tail -n1)
          echo "$body" | head -n -1
          if [ "$code" != "200" ]; then
            echo "::error::weekly-draft returned HTTP $code"
            exit 1
          fi
