name: Blog — Daily Big Question Article (noon ET)

on:
  schedule:
    - cron: '0 16 * * *'                 # Daily 16:00 UTC = noon ET (EDT)
  workflow_dispatch:                    # manual trigger for testing
    inputs:
      count:
        description: 'Number of articles to generate (max 3)'
        required: false
        default: '1'

jobs:
  generate:
    name: Generate & publish blog article
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger blog generation
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/blog-questions?count=$COUNT")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Blog generation failed with status $HTTP_CODE"
            exit 1
          fi

# ── Required GitHub Secrets ──────────────────────────────────────────────────
# CRON_SECRET          — same secret used by scanner/tick and other cron routes
# NEXT_PUBLIC_APP_URL  — https://projectprofound.org (no trailing slash)
# ─────────────────────────────────────────────────────────────────────────────
