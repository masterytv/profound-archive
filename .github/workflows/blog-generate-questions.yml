name: Blog — Generate Big Questions (1/day)

on:
  # schedule:                            # ← UNCOMMENT after voice calibration approved
  #   - cron: '0 9 * * *'               # 9 AM UTC daily = 1 article/day
  workflow_dispatch:                      # manual trigger only until calibration approved
    inputs:
      count:
        description: 'Number of articles to generate (max 3)'
        required: false
        default: '1'

jobs:
  generate:
    name: Generate blog articles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger blog generation
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.BLOG_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/blog-questions?count=$COUNT")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Blog generation failed with status $HTTP_CODE"
            exit 1
          fi

# ── Required GitHub Secrets ──────────────────────────────────────────────────
# BLOG_CRON_SECRET     — random secret string (generate with: openssl rand -hex 32)
# NEXT_PUBLIC_APP_URL  — https://projectprofound.org (no trailing slash)
# ─────────────────────────────────────────────────────────────────────────────
# To enable the cron schedule after voice calibration:
#   1. Uncomment the `schedule:` block above
#   2. Commit and push to main
#   3. GitHub will pick up the schedule on next push
