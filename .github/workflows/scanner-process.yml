name: Video Processor (10m)

on:
  schedule:
    # Trigger video processing every 10 minutes.
    # The API returns 202 immediately (fire-and-forget) — actual processing
    # runs as a background task in Cloud Run (up to 300s via apphosting.yaml).
    # Results are tracked in the scan_queue and scan_runs DB tables.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      videos_per_tick:
        description: 'Number of videos to process (keep at 1)'
        required: false
        default: '1'

jobs:
  scanner-process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Video Processing
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${{ secrets.APP_URL }}/api/scanner/process" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"${{ secrets.CRON_SECRET }}\", \"videosPerTick\": ${{ github.event.inputs.videos_per_tick || 1 }}}" \
            --max-time 15)
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
