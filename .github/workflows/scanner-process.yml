name: Video Processor (10m)

on:
  # DISABLED: Moved to pg_cron/Oracle. Use workflow_dispatch to run manually.
  workflow_dispatch:
    inputs:
      videos_per_tick:
        description: 'Number of videos to process (keep at 1)'
        required: false
        default: '1'

jobs:
  scanner-process:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Trigger Video Processing
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://${{ secrets.APP_DIRECT_URL }}/api/scanner/process" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d "{\"videosPerTick\": ${{ github.event.inputs.videos_per_tick || 1 }}}" \
            --connect-timeout 15 \
            --max-time 540)
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then exit 1; fi
