name: Video Processor (10m)

on:
  schedule:
    # Process 1 video from the queue every 10 minutes.
    # Calls the Firebase App Hosting DIRECT URL (APP_DIRECT_URL secret) to
    # bypass Cloudflare's 100s connection limit. Cloud Run allows up to 300s.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      videos_per_tick:
        description: 'Number of videos to process (keep at 1)'
        required: false
        default: '1'

jobs:
  scanner-process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Video Processing
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://${{ secrets.APP_DIRECT_URL }}/api/scanner/process" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"${{ secrets.CRON_SECRET }}\", \"videosPerTick\": ${{ github.event.inputs.videos_per_tick || 1 }}}" \
            --max-time 280)
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then exit 1; fi
