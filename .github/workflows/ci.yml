# Safety-net CI — introduced 2026-06-10 (see docs/IMPROVEMENT_PLAN.md Phase 2,
# docs/BASELINE.md for the accepted typecheck/lint baselines).
#
# Typecheck and lint are NON-BLOCKING until the baseline in docs/BASELINE.md is
# burned down (Phase 4) — they run on every PR so reviewers can compare counts
# against the baseline. Tests are BLOCKING from day one.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (non-blocking — baseline in docs/BASELINE.md)
        run: npm run typecheck
        continue-on-error: true

      - name: Lint (non-blocking — baseline in docs/BASELINE.md)
        run: npm run lint
        continue-on-error: true

      - name: Tests (blocking)
        run: npm test
