name: Feedback Digest Weekly

on:
  schedule:
    # Every Monday at 9:00 AM UTC (5:00 AM ET)
    - cron: "0 9 * * 1"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  send-digest:
    name: Send Weekly Feedback Digest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger feedback digest endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://projectprofound.org/api/email/feedback-digest")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "Response code: $http_code"
          echo "Response body: $body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Feedback digest returned HTTP $http_code — $body"
            exit 1
          fi
