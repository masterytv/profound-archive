name: Weekly Maintenance Pipeline

on:
  # DISABLED: Moved to pg_cron/Oracle. Use workflow_dispatch to run manually.
  workflow_dispatch: {}

jobs:
  maintenance:
    name: Weekly Data Maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Normalize entities
        run: |
          echo "Step 1/3: Normalizing entities (fuzzy dedup)..."
          RESPONSE=$(curl -s --max-time 300 -X POST \
            "https://${{ secrets.APP_DIRECT_URL }}/api/cron/normalize-entities" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"dryRun": false}')
          echo "Response: $RESPONSE"
          # Don't fail the pipeline if normalization has no merges
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "Warning: normalize-entities returned an error. Continuing..."
          fi

      - name: Recompute channel scores
        run: |
          echo "Step 2/3: Recomputing channel scores..."
          RESPONSE=$(curl -s --max-time 300 -X POST \
            "https://${{ secrets.APP_DIRECT_URL }}/api/cron/recompute-channel-scores" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "::error::recompute-channel-scores failed"
            exit 1
          fi

      - name: Rebuild viz caches
        run: |
          echo "Step 3/3: Rebuilding viz caches..."
          RESPONSE=$(curl -s --max-time 300 -X POST \
            "https://${{ secrets.APP_DIRECT_URL }}/api/cron/rebuild-viz-caches" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "::error::rebuild-viz-caches failed"
            exit 1
          fi
          echo "Weekly maintenance complete."
