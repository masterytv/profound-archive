name: Channel Scanner (hourly)

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      videos_per_tick:
        description: 'Number of videos to process per tick'
        required: false
        default: '1'

jobs:
  scanner-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scanner Tick
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -L \
            "${{ secrets.APP_URL }}/api/scanner/tick?secret=${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"videosPerTick": ${{ github.event.inputs.videos_per_tick || 3 }}}' \
            --max-time 330)
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then exit 1; fi
