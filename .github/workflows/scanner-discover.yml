name: Channel Discovery (Hourly)

on:
  # DISABLED: Moved to pg_cron/Oracle. Use workflow_dispatch to run manually.
  workflow_dispatch:

jobs:
  scanner-discover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Channel Discovery
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
              "https://${{ secrets.APP_DIRECT_URL }}/api/scanner/discover" \
              -H "Content-Type: application/json" \
              -d "{\"secret\": \"${{ secrets.CRON_SECRET }}\"}" \
              --max-time 300)
            echo "HTTP Status: $HTTP_CODE"
            cat /tmp/response.txt
            echo ""

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "✅ Channel discovery completed successfully"
              exit 0
            fi

            echo "⚠️ Attempt $ATTEMPT failed with status $HTTP_CODE"
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Channel discovery failed after $MAX_ATTEMPTS attempts"
          exit 1
