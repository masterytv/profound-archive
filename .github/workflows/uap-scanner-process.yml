name: UAP Video Processor (10m, :05 offset, 3/tick)

on:
  # DISABLED: Moved to pg_cron/Oracle. Use workflow_dispatch to run manually.
  workflow_dispatch:
    inputs:
      videos_per_tick:
        description: 'Number of videos to process per tick'
        required: false
        default: '3'

jobs:
  uap-scanner-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger UAP Video Processing
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://${{ secrets.APP_DIRECT_URL }}/api/uap/scanner/process" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d "{\"videosPerTick\": ${{ github.event.inputs.videos_per_tick || 3 }}}" \
            --connect-timeout 15 \
            --max-time 600)
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then exit 1; fi
