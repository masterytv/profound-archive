name: UAP Video Processor (10m, :05 offset)

on:
  schedule:
    # Process 1 UAP video from the queue every 10 minutes.
    # Offset 5 min from NDE processor to avoid concurrent API calls.
    # Pipeline timing: 300-465s per video.
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:
    inputs:
      videos_per_tick:
        description: 'Number of videos to process (keep at 1)'
        required: false
        default: '1'

jobs:
  uap-scanner-process:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Trigger UAP Video Processing
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://${{ secrets.APP_DIRECT_URL }}/api/uap/intake/process" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"${{ secrets.CRON_SECRET }}\", \"videosPerTick\": ${{ github.event.inputs.videos_per_tick || 1 }}}" \
            --connect-timeout 15 \
            --max-time 540)
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then exit 1; fi
