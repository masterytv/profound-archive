name: UAP Triad Analysis (Weekly)

on:
  # DISABLED: Moved to pg_cron/Oracle. Use workflow_dispatch to run manually.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max videos to process'
        required: false
        default: '100'
      concurrency:
        description: 'Concurrent videos (default 3)'
        required: false
        default: '3'

jobs:
  triad-batch:
    name: UAP Triad Batch Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run UAP triad batch
        env:
          # Script reads SUPABASE_SERVICE_KEY (not _ROLE_KEY)
          NEXT_PUBLIC_SUPABASE_URL: https://vnycavclrndjwmpaugju.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npx tsx scripts/uap-batch-triad.ts \
            --limit ${{ github.event.inputs.limit || '100' }} \
            --concurrency ${{ github.event.inputs.concurrency || '3' }}
