name: UAP Knowledge Extraction (Weekly)

on:
  # DISABLED: Moved to pg_cron/Oracle. Use workflow_dispatch to run manually.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max videos to process'
        required: false
        default: '100'

jobs:
  knowledge-batch:
    name: UAP Knowledge Extraction Batch
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run UAP knowledge extraction
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vnycavclrndjwmpaugju.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npx tsx scripts/uap-knowledge-batch.ts \
            --limit ${{ github.event.inputs.limit || '100' }}
