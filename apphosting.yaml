# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Increase timeout to allow AI analysis pipeline to complete.
  # Pipeline timing (Apr 2026): 300-465s per video (7 parallel AI passes + embeddings).
  # Firebase App Hosting max is 3600s. The scanner tick processes 1 video at a time.
  timeoutSeconds: 600
  # 2 CPUs ensures AI inference calls aren't CPU-throttled
  cpu: 2

# Environment variables that will be available to your application at runtime.
env:
  # Force the fast Supadata caption path on this interactive host — manual admin
  # intakes run inside a 300-600s request window that can't absorb Bright Data's
  # multi-minute scrape jobs. Oracle batch pipelines leave this unset (Bright Data).
  - variable: CAPTION_PROVIDER
    value: "supadata"

  - variable: NEXT_PUBLIC_SEARCH_WEBHOOK_URL
    value: "https://n8n.awetomatic.com/webhook/4e993b0f-a3be-42ba-925d-4c5f78b3381c"
