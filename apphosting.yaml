# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Increase timeout to allow AI analysis pipeline to complete.
  # Pipeline timing (Apr 2026): 300-465s per video (7 parallel AI passes + embeddings).
  # Firebase App Hosting max is 3600s. The scanner tick processes 1 video at a time.
  timeoutSeconds: 600
  # 2 CPUs ensures AI inference calls aren't CPU-throttled
  cpu: 2

# Environment variables that will be available to your application at runtime.
env:
  # Force the fast Supadata caption path on this interactive host — manual admin
  # intakes run inside a 300-600s request window that can't absorb Bright Data's
  # multi-minute scrape jobs. Oracle batch pipelines leave this unset (Bright Data).
  - variable: CAPTION_PROVIDER
    value: "supadata"

  # Telegram Failure Notifications
  - variable: TELEGRAM_BOT_TOKEN
    secret: projects/432036554831/secrets/TELEGRAM_BOT_TOKEN/versions/1
  - variable: TELEGRAM_CHAT_ID
    secret: projects/432036554831/secrets/TELEGRAM_CHAT_ID/versions/1
  

  # Canonical production URL — used by auth redirects (login/callback)
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://projectprofound.org"

  # Supabase Configuration
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: "https://vnycavclrndjwmpaugju.supabase.co"
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWNhdmNscm5kandtcGF1Z2p1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcwNTcyNzksImV4cCI6MjA2MjYzMzI3OX0.L_ExCXhKaHxK_PnOokOlgTjp-eVOlolkj0TAG9WsojI
  
  # Securely reference the Supabase Service Key from Secret Manager
  - variable: SUPABASE_SERVICE_KEY
    secret: projects/432036554831/secrets/SUPABASE_SERVICE_KEY/versions/1

  - variable: OPENAI_API_KEY
    secret: projects/432036554831/secrets/OPENAI_API_KEY/versions/2

  # Anthropic — Claude drafting for the blog pipeline and questions-autogen.
  # Replaced OPENROUTER_API_KEY (2026-08-04): same models at the same token
  # prices, without OpenRouter's top-up fee or its shared monthly key limit.
  # Version MUST stay numeric — the floating alias fails App Hosting builds
  # (docs/LEARNINGS.md §5), so bump this by hand when the key is rotated.
  - variable: ANTHROPIC_API_KEY
    secret: projects/432036554831/secrets/ANTHROPIC_API_KEY/versions/1

  # Secret for securing Cron/Automated jobs
  - variable: CRON_SECRET
    secret: projects/432036554831/secrets/CRON_SECRET/versions/3

  # YouTube Data API key for channel scanner
  - variable: YOUTUBE_API_KEY
    secret: projects/432036554831/secrets/YOUTUBE_API_KEY/versions/2

  # Supadata API key for YouTube transcript fetching (active — Mar 2026)
  # Replaced Apify pintostudio actor which was being IP-blocked by YouTube.
  - variable: SUPADATA_API_KEY
    secret: projects/432036554831/secrets/SUPADATA_API_KEY/versions/1

  # Resend — transactional email provider for quiz subscriber CRM
  - variable: RESEND_API_KEY
    secret: projects/432036554831/secrets/RESEND_API_KEY/versions/1
  # Verified sending domain (mail.projectprofound.org verified in Resend)
  - variable: RESEND_FROM
    value: "Project Profound <noreply@mail.projectprofound.org>"

  # Apify API token — kept for potential future use (currently unused)
  - variable: APIFY_API_TOKEN
    secret: projects/432036554831/secrets/APIFY_API_TOKEN/versions/1

  # Google Analytics Data API — for /admin/analytics dashboard
  # GA_PROPERTY_ID is non-sensitive (numeric GA4 property ID)
  - variable: GA_PROPERTY_ID
    value: "505681821"
  # Create these secrets in Google Secret Manager before deploying:
  #   gcloud secrets create GA_CLIENT_EMAIL --data-file=- <<< "project-profound-analytics@studio-9638832619-7f197.iam.gserviceaccount.com"
  #   gcloud secrets create GA_PRIVATE_KEY --data-file=/path/to/private-key.txt
  - variable: GA_CLIENT_EMAIL
    secret: projects/432036554831/secrets/GA_CLIENT_EMAIL/versions/1
  - variable: GA_PRIVATE_KEY
    secret: projects/432036554831/secrets/GA_PRIVATE_KEY/versions/1

  # Tavily Search API — web search for blog article pipeline (replaced Perplexity, May 2026)
  - variable: TAVILY_API_KEY
    secret: projects/432036554831/secrets/TAVILY_API_KEY/versions/1

  # fal.ai — hero image generation for blog articles
  - variable: FAL_API_KEY
    secret: projects/432036554831/secrets/FAL_API_KEY/versions/1
